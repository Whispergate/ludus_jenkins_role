---
# Port Jenkins will listen on (mapped to host)
ludus_jenkins_http_port: 8080

# Jenkins agent port (mapped to host)
ludus_jenkins_agent_port: 50000

# Jenkins Docker image
ludus_jenkins_docker_image: jenkins/jenkins
ludus_jenkins_docker_tag: lts-jdk21

# Jenkins container name
ludus_jenkins_container_name: jenkins

# Docker network name for Jenkins
ludus_jenkins_docker_network: jenkins

# Jenkins data volume name
ludus_jenkins_data_volume: jenkins-data

# Whether to skip the initial setup wizard
ludus_jenkins_skip_setup_wizard: true

# List of Jenkins plugins to install
ludus_jenkins_plugins:
  - git
  - workflow-aggregator
  - configuration-as-code
  - docker-plugin
  - docker-workflow

# Jenkins admin username and password (only used if ludus_jenkins_skip_setup_wizard is true)
ludus_jenkins_admin_user: admin
ludus_jenkins_admin_password: admin

# Additional Java arguments for Jenkins
ludus_jenkins_java_args: ""

# Jenkins home directory inside the container
ludus_jenkins_home: /var/jenkins_home

# Docker-in-Docker support (required for building Docker images in pipelines)
ludus_jenkins_enable_dind: true
ludus_jenkins_dind_container_name: jenkins-docker

# Custom Jenkins image (built locally with Docker CLI + plugins baked in)
ludus_jenkins_custom_image: myjenkins
ludus_jenkins_custom_image_tag: latest
ludus_jenkins_dockerfile_build_dir: /tmp/jenkins-docker-build

# Jenkins Configuration as Code (JCasC)
ludus_jenkins_casc_enabled: true
ludus_jenkins_casc_build_dir: /tmp/jenkins-casc
ludus_jenkins_casc_container_path: /var/jenkins_home/casc_configs

# Static (permanent) inbound agent nodes to pre-create on the controller via
# JCasC. Each runner VM running the ludus_jenkins_agent(_windows) role needs a
# matching node here so it has a node to attach to and a secret to fetch.
# The 'name' MUST match the agent's ludus_jenkins_agent_name (default: the
# runner's inventory hostname). Empty by default (no static nodes).
# Example:
#   ludus_jenkins_static_agents:
#     - name: MAA-runner-win01
#       labels: "windows-msvc windows-dotnet"
#       remote_fs: 'C:\Jenkins'
#       executors: 2
#     - name: MAA-runner-lin01
#       labels: "linux-generic"
#       remote_fs: /opt/jenkins-agent
#       executors: 2
ludus_jenkins_static_agents: []

# Dynamic Docker agent configuration
# When enabled, a JCasC "docker" cloud is configured for dynamic agents. This
# requires the docker-plugin (Docker Cloud) plugin, which the role installs
# automatically regardless of ludus_jenkins_plugins. Set to false to omit the
# cloud block entirely (e.g. if you only want the base Jenkins server).
ludus_jenkins_docker_cloud_enabled: true
ludus_jenkins_docker_agent_image: jenkins/agent:latest
ludus_jenkins_docker_agent_label: docker-agent
