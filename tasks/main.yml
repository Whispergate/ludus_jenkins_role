---
- name: Install Python Docker SDK (required by community.docker modules)
  ansible.builtin.apt:
    name:
      - python3-docker
      - python3-requests
    state: present
    update_cache: true

- name: Create Jenkins Docker network
  community.docker.docker_network:
    name: "{{ ludus_jenkins_docker_network }}"
    state: present

- name: Create Jenkins data volume
  community.docker.docker_volume:
    name: "{{ ludus_jenkins_data_volume }}"
    state: present

- name: Run Docker-in-Docker container
  community.docker.docker_container:
    name: "{{ ludus_jenkins_dind_container_name }}"
    image: docker:dind
    state: started
    restart_policy: always
    privileged: true
    networks:
      - name: "{{ ludus_jenkins_docker_network }}"
        aliases:
          - docker
    env:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - "{{ ludus_jenkins_data_volume }}:{{ ludus_jenkins_home }}"
    published_ports:
      - "2375:2375"
  when: ludus_jenkins_enable_dind

- name: Create Dockerfile build directory
  ansible.builtin.file:
    path: "{{ ludus_jenkins_dockerfile_build_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Dockerfile template
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ ludus_jenkins_dockerfile_build_dir }}/Dockerfile"
    mode: "0644"

- name: Build custom Jenkins image
  community.docker.docker_image:
    name: "{{ ludus_jenkins_custom_image }}"
    tag: "{{ ludus_jenkins_custom_image_tag }}"
    source: build
    force_source: true
    build:
      path: "{{ ludus_jenkins_dockerfile_build_dir }}"
      pull: false
    state: present

- name: Create JCasC config directory
  ansible.builtin.file:
    path: "{{ ludus_jenkins_casc_build_dir }}"
    state: directory
    mode: "0755"
  when: ludus_jenkins_casc_enabled

- name: Deploy JCasC config template
  ansible.builtin.template:
    src: jenkins.yaml.j2
    dest: "{{ ludus_jenkins_casc_build_dir }}/jenkins.yaml"
    mode: "0644"
  when: ludus_jenkins_casc_enabled
  notify: Restart Jenkins

- name: Build Jenkins environment variables
  ansible.builtin.set_fact:
    ludus_jenkins_env: >-
      {{
        {
          'JAVA_OPTS': (
            ('-Djenkins.install.runSetupWizard=false ' if ludus_jenkins_skip_setup_wizard else '') +
            ludus_jenkins_java_args
          ) | trim
        } | combine(
          {'DOCKER_HOST': 'tcp://docker:2375'} if ludus_jenkins_enable_dind else {}
        ) | combine(
          {'CASC_JENKINS_CONFIG': ludus_jenkins_casc_container_path} if ludus_jenkins_casc_enabled else {}
        )
      }}

- name: Run Jenkins container
  community.docker.docker_container:
    name: "{{ ludus_jenkins_container_name }}"
    image: "{{ ludus_jenkins_custom_image }}:{{ ludus_jenkins_custom_image_tag }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: on-failure
    networks:
      - name: "{{ ludus_jenkins_docker_network }}"
    ports:
      - "{{ ludus_jenkins_http_port }}:8080"
      - "{{ ludus_jenkins_agent_port }}:50000"
    volumes: >-
      {{
        [ludus_jenkins_data_volume + ':' + ludus_jenkins_home] +
        ([ludus_jenkins_casc_build_dir + ':' + ludus_jenkins_casc_container_path + ':ro']
          if ludus_jenkins_casc_enabled else [])
      }}
    env: "{{ ludus_jenkins_env }}"

- name: Wait for Jenkins to start
  block:
    - name: Poll Jenkins HTTP endpoint until ready
      ansible.builtin.uri:
        url: "http://localhost:{{ ludus_jenkins_http_port }}/login"
        method: GET
        status_code: 200
      register: jenkins_status
      retries: 30
      delay: 5
      until: jenkins_status.status == 200
  rescue:
    - name: Get Jenkins container state
      community.docker.docker_container_info:
        name: "{{ ludus_jenkins_container_name }}"
      register: jenkins_container_info

    - name: Fetch recent Jenkins container logs
      ansible.builtin.command:
        cmd: "docker logs --tail 100 {{ ludus_jenkins_container_name }}"
      register: jenkins_logs
      changed_when: false
      failed_when: false

    - name: Show Jenkins startup diagnostics
      ansible.builtin.debug:
        msg: >-
          Jenkins did not become ready. Container status:
          {{ jenkins_container_info.container.State.Status | default('unknown') }}
          (exit code {{ jenkins_container_info.container.State.ExitCode | default('n/a') }}).
          --- Last 100 log lines ---
          {{ jenkins_logs.stdout | default('') }}
          {{ jenkins_logs.stderr | default('') }}

    - name: Fail with Jenkins startup error
      ansible.builtin.fail:
        msg: >-
          Jenkins failed to start within the timeout. Review the container logs
          shown above for the root cause (commonly a JCasC or plugin error).

- name: Configure admin user
  ansible.builtin.include_tasks:
    file: configure_admin.yml
  when: ludus_jenkins_skip_setup_wizard

- name: Flush pending handlers before verifying static nodes
  ansible.builtin.meta: flush_handlers

- name: Wait for Jenkins after handler restart
  ansible.builtin.uri:
    url: "http://localhost:{{ ludus_jenkins_http_port }}/login"
    method: GET
    status_code: 200
  register: jenkins_post_handler
  retries: 30
  delay: 5
  until: jenkins_post_handler.status == 200
  when: ludus_jenkins_casc_enabled

- name: Check whether static agent nodes exist
  ansible.builtin.uri:
    url: "http://localhost:{{ ludus_jenkins_http_port }}/computer/{{ item.name }}/api/json"
    method: GET
    url_username: "{{ ludus_jenkins_admin_user }}"
    url_password: "{{ ludus_jenkins_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: ludus_jenkins_node_check
  loop: "{{ ludus_jenkins_static_agents }}"
  when: ludus_jenkins_static_agents | default([]) | length > 0

- name: Restart Jenkins to apply JCasC (static nodes missing)
  community.docker.docker_container:
    name: "{{ ludus_jenkins_container_name }}"
    state: started
    restart: true
  when: >-
    ludus_jenkins_static_agents | default([]) | length > 0 and
    ludus_jenkins_node_check.results | selectattr('status', 'equalto', 404) | list | length > 0

- name: Wait for Jenkins after JCasC reload
  ansible.builtin.uri:
    url: "http://localhost:{{ ludus_jenkins_http_port }}/login"
    method: GET
    status_code: 200
  register: jenkins_casc_reload_wait
  retries: 30
  delay: 5
  until: jenkins_casc_reload_wait.status == 200
  when: >-
    ludus_jenkins_static_agents | default([]) | length > 0 and
    ludus_jenkins_node_check.results | selectattr('status', 'equalto', 404) | list | length > 0
